---
title: Mobilité
layout: home
permalink: /mobilite/
---

<section class="mob-section py-5">
  <div class="container">
    <h1 class="mob-title">International mobility</h1>
    <div class="mob-rule" aria-hidden="true"></div>

    <div class="row g-0 mob-grid">
      {% for choice in site.data.mobilite %}
      <article class="col-lg-4 mob-col">
        <div class="mob-badge" aria-hidden="true">{{ forloop.index }}</div>
        <p class="mob-rank">{{ choice.rank }}</p>
        <h2 class="mob-name">{{ choice.name }}</h2>
        <p class="mob-country"><span aria-hidden="true">📍</span> {{ choice.country }}</p>
        {% for p in choice.paragraphs %}
        <p class="mob-text">{{ p }}</p>
        {% endfor %}
      </article>
      {% endfor %}
    </div>
  </div>
</section>
