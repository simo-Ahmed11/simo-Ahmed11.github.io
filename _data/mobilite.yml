  paragraphs:
    - "In my department at l’ENSEEIHT, focusing on Fluid Mechanics, Energy, and Environment, I am keen to explore advanced sustainable solutions. At Chalmers University of Technology, there is a program that matches perfectly with what I study at l’ENSEEIHT, particularly featuring courses on sustainable energy conversion, fluid dynamics, and environmental engineering."
    - "It will be an enriching experience for me because Sweden is a pioneer in green transition and sustainability, which aligns closely with my professional project in engineering and consulting. Living in a new country will also help me develop new skills such as adapting quickly to an unfamiliar environment, working collaboratively in diverse teams, and gaining greater autonomy."
- rank: "Third choice of destination"
  name: "Imperial College London"
  country: "United Kingdom"
  paragraphs:
    - "At this prestigious university, they offer a wide range of cutting-edge courses. Some of them focus on advanced fluid mechanics, energy systems, and environmental fluid dynamics that could be directly linked with my professional project in engineering and consulting. We have a lot of academic choices, so I will surely find fascinating modules that complement my curriculum at l’ENSEEIHT."
